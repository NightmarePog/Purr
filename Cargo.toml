[package]
name = "aur-pkg-manager"
version = "0.1.0"
edition = "2024"

[dependencies]
alpm = { git = "https://github.com/archlinux/alpm.rs", features = ["git"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
srcinfo = "2"
owo-colors = { version = "4.3.0", features = ["supports-colors"] }
thiserror = "2"
dirs = "6.0.0"
comfy-table = "7.2.2"
console = "0.16.4"
indicatif = { version = "0.18.6", default-features = false, features = ["unicode-width"] }
const_format = "0.2.36"
